<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pierce</title>
<style>
:root{--bg:#0d0e11;--ink:#e9e7e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e11;--ink:#e9e7e1;color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f0ec;--ink:#15161a;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0d0e11;--ink:#e9e7e1}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
p{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);opacity:.4;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Animação com a palavra PIERCE feita de pontos"></canvas>
<p>clique para alternar entre pontos e ASCII</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RAMP = ' .·:-=+*#%@';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, cell, cols, rows, mask, rnd, mode = 0, t0 = performance.now();
const mouse = { x: -999, y: -999 };

function build() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cell = W < 600 ? 7 : 9;
  cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);

  const o = document.createElement('canvas');
  o.width = cols; o.height = rows;
  const c = o.getContext('2d');
  c.fillStyle = '#000'; c.fillRect(0, 0, cols, rows);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const face = "'Arial Black', Impact, 'Helvetica Neue', sans-serif";
  c.font = `900 100px ${face}`;
  const w = c.measureText('PIERCE').width;
  const fs = Math.min(100 * cols * 0.88 / w, rows * 0.6);
  c.font = `900 ${fs}px ${face}`;
  try { c.filter = 'blur(0.6px)'; } catch (e) {}
  c.fillText('PIERCE', cols / 2, rows / 2);

  const d = c.getImageData(0, 0, cols, rows).data;
  mask = new Float32Array(cols * rows);
  rnd = new Float32Array(cols * rows);
  for (let i = 0; i < mask.length; i++) { mask[i] = d[i * 4] / 255; rnd[i] = Math.random(); }
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function frame(ms) {
  const t = still ? 6 : (ms - t0) / 1000;
  const cs = getComputedStyle(document.documentElement);
  const bg = cs.getPropertyValue('--bg').trim(), ink = cs.getPropertyValue('--ink').trim();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = ink;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${cell * 1.25}px ui-monospace, Menlo, Consolas, monospace`;

  const reveal = Math.min(1, t / 3);
  const R = 90;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      const k = clamp((reveal * 1.7 - x / cols * 0.7 - rnd[i] * 0.4) * 3, 0, 1);
      const m = mask[i] * k;

      const n = 0.5 + 0.5 * Math.sin(x * 0.21 + t * 0.9) * Math.cos(y * 0.17 - t * 0.6);
      let level = m * 0.95 + (1 - m) * (0.04 + 0.16 * n) * Math.min(1, t / 1.2);

      let px = x * cell + cell / 2;
      let py = y * cell + cell / 2;

      const mx = px - mouse.x, my = py - mouse.y, md = Math.hypot(mx, my);
      if (md < R && md > 0) {
        const f = (1 - md / R) ** 2;
        px += mx / md * f * 28; py += my / md * f * 28;
        level = Math.min(1, level + f * 0.35);
      }

      if (level < 0.04) continue;
      if (mode === 0) {
        ctx.globalAlpha = Math.min(1, 0.2 + level * 0.9);
        ctx.beginPath();
        ctx.arc(px, py, cell * 0.5 * Math.sqrt(level), 0, 6.2832);
        ctx.fill();
      } else {
        const ch = RAMP[Math.min(RAMP.length - 1, (level * RAMP.length) | 0)];
        if (ch === ' ') continue;
        ctx.globalAlpha = Math.min(1, 0.3 + level * 0.7);
        ctx.fillText(ch, px, py);
      }
    }
  }
  if (!still) requestAnimationFrame(frame);
}

addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerleave', () => { mouse.x = mouse.y = -999; });
cv.addEventListener('click', () => { mode = 1 - mode; if (still) requestAnimationFrame(frame); });
addEventListener('resize', () => { build(); if (still) requestAnimationFrame(frame); });

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
